<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>候車 · 香港巴士到站</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b4f6c'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23e8c547'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%230b4f6c'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1 data-i18n="title">候車</h1>
          <p data-i18n="subtitle">香港巴士到站 · 附近車站 · 路線搜尋</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="lang-btn" class="ghost" aria-label="Language">EN</button>
      </div>
    </header>

    <div class="map-shell">
      <div id="map" role="img" aria-label="地圖"></div>
      <button type="button" id="locate-btn" class="locate-btn" data-i18n="locate">定位</button>
    </div>

    <main>
      <div class="tabs" role="tablist">
        <button type="button" id="tab-nearby" class="tab active" data-tab="nearby" data-i18n="tabNearby">
          附近
        </button>
        <button type="button" id="tab-search" class="tab" data-tab="search" data-i18n="tabSearch">搜尋</button>
      </div>

      <section id="nearby-panel">
        <p id="nearby-status" class="status"></p>
        <div id="nearby-list" class="nearby-list"></div>
      </section>

      <section id="search-panel" hidden>
        <section class="search-card">
          <label for="route-input" data-i18n="searchLabel">路線編號</label>
          <form id="search-form" class="search-row">
            <input
              id="route-input"
              name="route"
              type="search"
              inputmode="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="例如 A31、A11、1、104"
            />
            <button type="submit" data-i18n="search">搜尋</button>
          </form>
          <p id="status" class="status" hidden></p>
        </section>

        <section id="favorites" class="panel" hidden>
          <h2 data-i18n="favorites">常用車站</h2>
          <div id="favorite-list" class="chips"></div>
        </section>

        <section id="variants" class="panel" hidden>
          <h2 id="variants-title"></h2>
          <div id="variant-list" class="variant-list"></div>
        </section>

        <section id="stops" class="panel" hidden>
          <div class="panel-head">
            <button type="button" id="back-btn" class="ghost" data-i18n="back">← 返回路線</button>
            <h2 id="stops-title"></h2>
          </div>
          <div id="stop-list" class="stop-list"></div>
        </section>

        <section id="eta" class="panel eta-panel" hidden>
          <div class="panel-head">
            <h2 id="eta-title"></h2>
            <button type="button" id="fav-btn" class="ghost">☆</button>
          </div>
          <p id="eta-meta" class="muted"></p>
          <div id="eta-list" class="eta-list"></div>
          <p id="eta-updated" class="muted small"></p>
        </section>
      </section>
    </main>

    <footer>
      <p data-i18n="footer">到站資料來自香港政府開放數據（九巴／龍運／城巴），約每分鐘更新。本頁並非任何巴士公司的官方應用程式。</p>
    </footer>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
