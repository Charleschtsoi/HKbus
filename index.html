<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>站頭 · 香港巴士地圖</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b4f6c'/%3E%3Cpath fill='%23e8c547' d='M12 18c0-3.3 2.7-6 6-6h28c3.3 0 6 2.7 6 6v24c0 2.2-1.8 4-4 4h-2.2c-.5 3-3.1 5.3-6.3 5.3s-5.8-2.3-6.3-5.3H32.8c-.5 3-3.1 5.3-6.3 5.3s-5.8-2.3-6.3-5.3H16c-2.2 0-4-1.8-4-4V18z'/%3E%3Crect x='16' y='16' width='10' height='10' rx='2' fill='%230b4f6c'/%3E%3Crect x='28' y='16' width='10' height='10' rx='2' fill='%230b4f6c'/%3E%3Crect x='40' y='16' width='8' height='10' rx='2' fill='%230b4f6c'/%3E%3Crect x='46' y='30' width='4' height='5' rx='1' fill='%23d94f30'/%3E%3Ccircle cx='26.5' cy='46' r='4.5' fill='%230b4f6c'/%3E%3Ccircle cx='26.5' cy='46' r='1.8' fill='%23e8c547'/%3E%3Ccircle cx='43.5' cy='46' r='4.5' fill='%230b4f6c'/%3E%3Ccircle cx='43.5' cy='46' r='1.8' fill='%23e8c547'/%3E%3C/svg%3E"
    />
  </head>
  <body class="map-expanded">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <rect width="64" height="64" rx="14" fill="#0b4f6c" />
            <path
              fill="#e8c547"
              d="M12 18c0-3.3 2.7-6 6-6h28c3.3 0 6 2.7 6 6v24c0 2.2-1.8 4-4 4h-2.2c-.5 3-3.1 5.3-6.3 5.3s-5.8-2.3-6.3-5.3H32.8c-.5 3-3.1 5.3-6.3 5.3s-5.8-2.3-6.3-5.3H16c-2.2 0-4-1.8-4-4V18z"
            />
            <rect x="16" y="16" width="10" height="10" rx="2" fill="#0b4f6c" />
            <rect x="28" y="16" width="10" height="10" rx="2" fill="#0b4f6c" />
            <rect x="40" y="16" width="8" height="10" rx="2" fill="#0b4f6c" />
            <rect x="46" y="30" width="4" height="5" rx="1" fill="#d94f30" />
            <circle cx="26.5" cy="46" r="4.5" fill="#0b4f6c" />
            <circle cx="26.5" cy="46" r="1.8" fill="#e8c547" />
            <circle cx="43.5" cy="46" r="4.5" fill="#0b4f6c" />
            <circle cx="43.5" cy="46" r="1.8" fill="#e8c547" />
          </svg>
        </span>
        <div>
          <h1 data-i18n="title">站頭</h1>
          <p data-i18n="subtitle">香港巴士站頭 · 附近車站 · 路線地圖</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="account-btn" class="ghost account-btn" data-i18n="accountGuest">
          訪客
        </button>
        <button type="button" id="lang-btn" class="ghost" aria-label="Language">EN</button>
      </div>
    </header>

    <dialog id="account-dialog" class="account-dialog">
      <div class="account-sheet">
        <div class="account-sheet-head">
          <h2 id="account-dialog-title" data-i18n="accountTitle">帳戶（可選）</h2>
          <button type="button" id="account-close-btn" class="ghost" data-i18n="close">關閉</button>
        </div>
        <p id="account-dialog-lead" class="muted account-lead" data-i18n="accountLead">
          登入後可同步常用車站。唔登入都可以用，常用車站會留喺呢部裝置。
        </p>
        <p id="account-mode-hint" class="account-mode-hint"></p>

        <form id="account-form" novalidate>
          <div id="account-signed-out">
            <label class="account-field">
              <span data-i18n="email">電郵</span>
              <input id="account-email" type="email" autocomplete="username" />
            </label>
            <label class="account-field">
              <span data-i18n="password">密碼</span>
              <input id="account-password" type="password" autocomplete="current-password" minlength="6" />
            </label>
            <label class="account-check">
              <input id="account-merge-guest" type="checkbox" checked />
              <span data-i18n="mergeGuest">登入時合併呢部裝置已儲存嘅常用車站</span>
            </label>
            <p id="account-error" class="account-error" hidden></p>
            <div class="account-actions">
              <button type="submit" id="account-login-btn" data-i18n="signIn">登入</button>
              <button type="button" id="account-register-btn" class="ghost" data-i18n="register">建立帳戶</button>
            </div>
          </div>

          <div id="account-signed-in" hidden>
            <p id="account-user-line" class="account-user-line"></p>
            <p id="account-sync-line" class="muted small"></p>
            <div class="account-actions">
              <button type="button" id="account-logout-btn" class="ghost" data-i18n="signOut">登出</button>
            </div>
          </div>
        </form>
      </div>
    </dialog>

    <div class="map-shell" id="map-shell">
      <div id="map" role="img" aria-label="地圖"></div>
      <div class="map-controls">
        <button type="button" id="expand-map-btn" class="map-btn" aria-pressed="false">
          <span class="map-btn-icon" aria-hidden="true">⛶</span>
          <span data-i18n="expandMap">放大地圖</span>
        </button>
        <button type="button" id="locate-btn" class="map-btn" data-i18n="locate">定位</button>
      </div>
      <div id="map-caption" class="map-caption" hidden>
        <div class="map-caption-text">
          <strong id="map-caption-title"></strong>
          <span id="map-caption-sub" class="muted"></span>
        </div>
        <button type="button" id="collapse-map-btn" class="ghost map-caption-close" data-i18n="collapseMap">
          收起
        </button>
      </div>
    </div>

    <main id="app-main">
      <div class="tabs" role="tablist">
        <button type="button" id="tab-nearby" class="tab active" data-tab="nearby" data-i18n="tabNearby">
          附近
        </button>
        <button type="button" id="tab-search" class="tab" data-tab="search" data-i18n="tabSearch">搜尋</button>
      </div>

      <section id="nearby-panel">
        <p id="nearby-status" class="status" role="status" aria-live="polite"></p>
        <p id="nearby-meta" class="muted small nearby-meta" hidden></p>
        <div id="nearby-list" class="nearby-list"></div>
      </section>

      <section id="search-panel" hidden>
        <section class="search-card">
          <label for="route-input" data-i18n="searchLabel">路線編號</label>
          <form id="search-form" class="search-row">
            <input
              id="route-input"
              name="route"
              type="search"
              inputmode="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="例如 A31、A11、1、104"
            />
            <button type="submit" data-i18n="search">搜尋</button>
          </form>
          <p id="status" class="status" hidden></p>
        </section>

        <section id="favorites" class="panel" hidden>
          <div class="panel-head favorites-head">
            <h2 data-i18n="favorites">常用車站</h2>
            <p id="favorites-sync-note" class="muted small favorites-sync-note"></p>
          </div>
          <div id="favorite-list" class="chips"></div>
        </section>

        <section id="variants" class="panel" hidden>
          <h2 id="variants-title"></h2>
          <div id="variant-list" class="variant-list"></div>
        </section>

        <section id="stops" class="panel" hidden>
          <div class="panel-head">
            <button type="button" id="back-btn" class="ghost" data-i18n="back">← 返回路線</button>
            <h2 id="stops-title"></h2>
          </div>
          <button type="button" id="view-route-map-btn" class="view-route-map-btn" data-i18n="viewRouteMap">
            放大睇路線
          </button>
          <div id="stop-list" class="stop-list"></div>
        </section>

        <section id="eta" class="panel eta-panel" hidden>
          <div class="panel-head">
            <h2 id="eta-title"></h2>
            <button type="button" id="fav-btn" class="ghost">☆</button>
          </div>
          <p id="eta-meta" class="muted"></p>
          <div id="eta-list" class="eta-list"></div>
          <p id="eta-updated" class="muted small"></p>
        </section>
      </section>
    </main>

    <footer>
      <p data-i18n="footer">到站資料來自香港政府開放數據（九巴／龍運／城巴），約每分鐘更新。本頁並非任何巴士公司的官方應用程式。</p>
    </footer>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="config.js"></script>
    <script src="account.js"></script>
    <script src="app.js"></script>
  </body>
</html>
